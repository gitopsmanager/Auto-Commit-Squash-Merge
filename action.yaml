name: "Auto-Commit-Squash-Merge"
description: >
  Commits and pushes changes to a temporary branch, opens a pull request,
  retries squash-merge with fixed and random backoff, then deletes the branch.
  Generic version usable on any repository.

author: "GitOps Manager, S.L."
branding:
  icon: git-merge
  color: blue

# v2 takes every v1 call unchanged: the same inputs, the same defaults. The
# inputs added in v2 are optional, and a call that leaves them out behaves as
# v1 did. Two differences, neither changing a result: a pull request GitHub
# reports conflicted ("dirty") on two checks in a row fails at once instead of
# after every retry, and the temporary branch's name carries the run id, so
# two runs in the same second cannot collide.

inputs:
  token:
    description: "GitHub App or PAT token used for commits and PRs"
    required: true
    type: string

  repo_owner:
    description: "Owner or organization of the target repository"
    required: true
    type: string

  repo_name:
    description: "Name of the target repository"
    required: true
    type: string

  namespace:
    description: "Optional contextual label (e.g., environment or namespace)"
    required: false
    default: ""
    type: string

  cluster:
    description: "Optional contextual label (e.g., cluster or system name)"
    required: false
    default: ""
    type: string

  app_name:
    description: "Application or logical name for commit message"
    required: false
    default: ""
    type: string

  repo_path_rel:
    description: "Relative path to the files being committed"
    required: true
    type: string

  delete_only:
    description: "If true, performs delete-only commit and merge path"
    required: false
    default: false
    type: string

  # ---- v2 ----------------------------------------------------------------

  path:
    description: "v2. The checkout to commit from, relative to the workspace."
    required: false
    default: "continuous-deployment"
    type: string

  extra_paths:
    description: "v2. More paths to commit with repo_path_rel, relative to path, space-separated."
    required: false
    default: ""
    type: string

  base_branch:
    description: "v2. The branch to merge into. Empty: the repository's default branch."
    required: false
    default: ""
    type: string

  skip_if_unchanged:
    description: >
      v2. true: when nothing changed, commit nothing, open no pull request, and
      report changed=false. false (v1): an empty commit is made and merged.
    required: false
    default: "false"
    type: string

  commit_message:
    description: >
      v2. The commit message; its first line is also the squash commit's title.
      Empty: "Deploy to <cluster>/<namespace> for <app_name>" (v1).
    required: false
    default: ""
    type: string

  pr_title:
    description: "v2. The pull request's title. Empty: the commit message's first line, else v1's."
    required: false
    default: ""
    type: string

  push_auth:
    description: >
      v2. remote (v1): push with the checkout's own credentials. token: push
      with the token input, for a checkout made with persist-credentials false.
    required: false
    default: "remote"
    type: string

outputs:
  branch:
    description: "Temporary branch created by this action"
    value: ${{ steps.commit_deploy.outputs.branch }}
  changed:
    description: "v2. true when something was committed; false when nothing changed."
    value: ${{ steps.commit_deploy.outputs.changed }}
  commit_sha:
    description: "v2. The commit on the base branch: the squash commit, or the checkout's HEAD when nothing was committed."
    value: ${{ steps.merge.outputs.commit_sha || steps.commit_deploy.outputs.head_sha }}
  previous_sha:
    description: "v2. The commit the change was made on, when repo_path_rel already existed there; empty otherwise."
    value: ${{ steps.commit_deploy.outputs.previous_sha }}
  pr_url:
    description: "v2. The pull request, merged or not."
    value: ${{ steps.merge.outputs.pr_url }}

runs:
  using: "composite"
  steps:

    - name: Commit and push to temp branch
      id: commit_deploy
      if: ${{ inputs.delete_only == 'false' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        set -euo pipefail

        echo "🔎 Debug: Current working directory = $(pwd)"
        git remote -v

        git config user.name "auto-commit-squash-merge"
        git config user.email "actions@github.com"

        echo "🔎 Debug: Adding files from: ${REPO_PATH_REL}/"
        ls -la "${REPO_PATH_REL}/" || echo "⚠️ Directory not found"

        previous=""
        if git cat-file -e "HEAD:${REPO_PATH_REL%/}" 2>/dev/null; then
          previous=$(git rev-parse HEAD)
        fi
        echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        paths=("${REPO_PATH_REL}/")
        for p in $EXTRA_PATHS; do paths+=("$p"); done
        git add -A -- "${paths[@]}"

        echo "🔎 Debug: Status after staging:"
        git status --short || true
        git diff --cached --stat || true

        if [ -n "$COMMIT_MESSAGE" ]; then
          message="$COMMIT_MESSAGE"
        else
          message="Deploy to ${CLUSTER}/${NAMESPACE} for ${APP_NAME}"
        fi

        if git diff --cached --quiet; then
          if [ "$SKIP_IF_UNCHANGED" = "true" ]; then
            echo "No changes in ${REPO_PATH_REL}: nothing committed."
            { echo "changed=false"; echo "previous_sha="; echo "skipped=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "⚠️ No changes detected — creating empty commit"
          git commit --allow-empty -m "No-op commit for ${APP_NAME} at $(date -u)"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "$message"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
        echo "previous_sha=$previous" >> "$GITHUB_OUTPUT"

        # The run id (and a random tail) keeps two runs, or two calls in one
        # job, from ever picking the same branch.
        unique="${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-1}-$(date +%s)-$RANDOM"
        if [ -n "$CLUSTER$NAMESPACE$APP_NAME" ]; then
          branch="deploy-${CLUSTER}-${NAMESPACE}-${APP_NAME}-${unique}"
        else
          branch="auto-commit-${unique}"
        fi
        echo "🔎 Debug: Branch to push = $branch"

        git log -1 --oneline

        if [ "$PUSH_AUTH" = "token" ]; then
          # The token, and only the token: an empty extraheader clears any
          # credentials a checkout left behind.
          server="${GITHUB_SERVER_URL:-https://github.com}"
          git -c http.extraheader= -c "http.${server}/.extraheader=" push --verbose \
            "${server/https:\/\//https://x-access-token:${GIT_TOKEN}@}/${REPO_OWNER}/${REPO_NAME}.git" \
            HEAD:"refs/heads/$branch" || { echo "❌ git push failed"; exit 1; }
        else
          git push --verbose origin HEAD:"$branch" || { echo "❌ git push failed"; exit 1; }
          git ls-remote origin "refs/heads/$branch" || echo "⚠️ Branch not found on remote"
        fi

        echo "branch=$branch" >> "$GITHUB_OUTPUT"
        echo "message_title=$(printf '%s\n' "$message" | head -n1)" >> "$GITHUB_OUTPUT"
      env:
        GIT_TOKEN: ${{ inputs.token }}
        REPO_OWNER: ${{ inputs.repo_owner }}
        REPO_NAME: ${{ inputs.repo_name }}
        REPO_PATH_REL: ${{ inputs.repo_path_rel }}
        EXTRA_PATHS: ${{ inputs.extra_paths }}
        CLUSTER: ${{ inputs.cluster }}
        NAMESPACE: ${{ inputs.namespace }}
        APP_NAME: ${{ inputs.app_name }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
        SKIP_IF_UNCHANGED: ${{ inputs.skip_if_unchanged }}
        PUSH_AUTH: ${{ inputs.push_auth }}

    - name: Simple retrying API-based squash merge
      id: merge
      if: ${{ inputs.delete_only == 'false' && steps.commit_deploy.outputs.skipped != 'true' }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = process.env.REPO_OWNER;
          const repo = process.env.REPO_NAME;
          const branch = process.env.BRANCH;
          const appName = process.env.APP_NAME;
          const commitMessage = process.env.COMMIT_MESSAGE || "";

          async function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

          const fixedRetries = 10;   // 2s interval
          const randomRetries = 20;  // 1–7.5s randomized
          const maxRetries = fixedRetries + randomRetries;
          let prNumber = null;
          let merged = false;
          // Consecutive checks on which GitHub reported the PR conflicted.
          let dirtyChecks = 0;

          try {
            // --- Base branch: the one asked for, else the default ---
            let baseBranch = process.env.BASE_BRANCH;
            if (!baseBranch) {
              const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
              baseBranch = repoInfo.default_branch;
            }
            core.info(`ℹ️ Base branch = ${baseBranch}`);

            // --- Create PR ---
            const title = process.env.PR_TITLE
              || (commitMessage ? process.env.MESSAGE_TITLE : "")
              || `Deploy ${appName} to ${process.env.CLUSTER}/${process.env.NAMESPACE}`;
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: baseBranch,
              title,
              body: commitMessage || "Automated commit and squash-merge update."
            });
            prNumber = pr.number;
            core.setOutput("pr_url", pr.html_url);
            core.info(`✅ Opened PR #${pr.number}`);

            // The squash commit's title and body: the caller's message when
            // given (v2); GitHub's own otherwise (v1).
            const mergeArgs = { owner, repo, pull_number: pr.number, merge_method: "squash" };
            if (commitMessage) {
              const lines = commitMessage.split("\n");
              mergeArgs.commit_title = lines[0];
              mergeArgs.commit_message = lines.slice(1).join("\n").trim();
            }

            // --- Attempt merge loop ---
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
              try {
                const { data: result } = await github.rest.pulls.merge(mergeArgs);
                core.setOutput("commit_sha", result.sha);
                core.info(`✅ Squash-merged PR #${pr.number} on attempt ${attempt} (${result.sha})`);
                merged = true;
                break;
              } catch (err) {
                const msg = err.message || "";
                core.warning(`⚠️ Merge attempt ${attempt} failed: ${msg}`);

                // Hard conflict — same-file edits — fail immediately
                if (/conflict|cannot.*merge.*due to conflicts/i.test(msg)) {
                  core.setFailed(`❌ Real merge conflict detected for PR #${pr.number}.`);
                  break;
                }

                // GitHub's own verdict. Only "dirty" (conflicted), seen on two
                // checks in a row, ends the retries early: mergeability is
                // worked out in the background, and every other state --
                // unknown, blocked, behind, unstable, or one added later -- is
                // retried as before.
                try {
                  const { data: state } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                  dirtyChecks = state.mergeable_state === "dirty" ? dirtyChecks + 1 : 0;
                } catch (e) {
                  dirtyChecks = 0;
                }
                if (dirtyChecks >= 2) {
                  core.setFailed(`❌ PR #${pr.number} conflicts with ${baseBranch}: GitHub reports it not mergeable.`);
                  break;
                }

                // Otherwise, retry (transient base-modified/unknown state)
                if (attempt <= fixedRetries) {
                  await wait(2000); // first 10 tries = fixed 2s
                } else {
                  const delay = 1000 + Math.random() * 6500; // 1–7.5s
                  core.info(`⏳ Retrying in ${(delay / 1000).toFixed(1)}s...`);
                  await wait(delay);
                }
              }
            }

            if (!merged && dirtyChecks < 2) {
              core.setFailed(`❌ Could not squash-merge PR #${pr.number} after ${maxRetries} attempts.`);
            }

          } catch (err) {
            core.setFailed(`❌ Error during PR merge process: ${err.message || err}`);
          } finally {
            // --- Always cleanup ---
            if (prNumber) {
              if (!merged) {
                core.info(`🧹 Cleanup: PR #${prNumber} failed; deleting branch '${branch}' closes it, and its diff stays on the PR.`);
              }
              // --- Guard protected branches from deletion ---
              const protectedBranches = ["main", "master"];
              if (protectedBranches.includes(branch)) {
                core.warning(`🚫 Skipping deletion of protected branch '${branch}'.`);
              } else {
                try {
                  await github.rest.git.deleteRef({
                    owner, repo, ref: `heads/${branch}`
                  });
                  core.info(`🗑️ Deleted branch '${branch}'.`);
                } catch (e) {
                  core.warning(`⚠️ Could not delete branch '${branch}': ${e.message}`);
                }
              }
            }
          }
      env:
        REPO_OWNER: ${{ inputs.repo_owner }}
        REPO_NAME: ${{ inputs.repo_name }}
        BRANCH: ${{ steps.commit_deploy.outputs.branch }}
        CLUSTER: ${{ inputs.cluster }}
        NAMESPACE: ${{ inputs.namespace }}
        APP_NAME: ${{ inputs.app_name }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        PR_TITLE: ${{ inputs.pr_title }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
        MESSAGE_TITLE: ${{ steps.commit_deploy.outputs.message_title }}
